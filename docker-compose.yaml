services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    networks:
      - findle-network
    depends_on:
      - backend
    env_file:
      - ./frontend/.env

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    networks:
      - findle-network
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ./backend/.env

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    networks:
      - findle-network
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Idempotently initiate the single-node replica set, then report health.
      test: >-
        mongosh --quiet --eval
        "try { rs.status().ok }
         catch (e) {
           rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok
         }"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  findle-network:
    driver: bridge

volumes:
  mongo_data:
