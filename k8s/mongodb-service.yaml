apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: findle
  labels:
    app: mongodb
    app.kubernetes.io/part-of: findle
spec:
  # Headless service — gives each StatefulSet pod a stable DNS name:
  #   mongodb-0.mongodb.findle.svc.cluster.local
  #   mongodb-1.mongodb.findle.svc.cluster.local
  #   mongodb-2.mongodb.findle.svc.cluster.local
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
